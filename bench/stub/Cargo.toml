[package]
name = "benchmark_stub"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "benchmark_stub"
path = "src/main.rs"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
