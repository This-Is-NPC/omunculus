# The agency: the sales desk answering the client, with the dream team
# (packs/dream-team) and the design team (packs/design-team) beside the
# seller, at its depth, imported by the pack tool in that order, as the design
# team requires the dream team's deploy_preview. What the packs leave to the
# project is as in dream-team.toml; the workflows below compose the two
# teams.
[eval]
packs = [{ name = "sales-desk" }, { name = "dream-team", depth = 2 }, { name = "design-team", depth = 2 }]

[execution]
environment = ["LANG", "LC_ALL", "TERM", "HOME", "PATH", "OMUNCULUS_DEPLOY", "OMUNCULUS_DEPLOY_PROVIDER"]
timeout_ms = 300000

# The seller attaches the proposal it gives the client.
[store]
attachments = ".omunculus/attachments"
attachment_bytes = 10485760

[auth.homologation]
kind = "api_key"
key = "$OMUNCULUS_HOMOLOGATION_KEY"

[auth.production]
kind = "api_key"
key = "$OMUNCULUS_PRODUCTION_KEY"

# The design team checks what the builders built against the design the
# client approved: each item of the plan, then the whole before promote.
# The stage promote denies done, as the pack's: promote concludes it.
[workflows.page]
steps = [
  { name = "build", agent = "surgeon" },
  { name = "review", agent = "design-reviewer" },
]

[workflows.release]
steps = [
  { name = "publish", agent = "clerk", deny = ["done"] },
  { name = "accept", agent = "design-reviewer" },
  { name = "promote", agent = "clerk", deny = ["done"] },
]

[policy.depth.3]
workflows = ["design", "page", "release"]

# The owner decides the sale, a discount beyond the seller's limit and what
# goes to production; the harness opens no membership, so the route falls
# back to the conversation's person. The seller asks the project manager,
# its parent, with `to = "pm"`, and the client through the front desk. The
# release's request to grant promote goes to the project manager, who has
# the client accept the built site and then asks the owner.
[policy]
default_agent = "front-desk"
request_routes = [
  { name = "owner", via = ["owners", "origin"] },
  { name = "pm", via = ["parent"] },
  { workflow = "release", stage = "promote", via = [{ kind = "agent", agent = "project-manager" }] },
  { from = { kind = "agent", agent = "seller" }, via = [{ kind = "agent", agent = "front-desk" }, "origin"] },
  { via = ["parent", { kind = "agent", agent = "front-desk" }, "origin"] },
]
