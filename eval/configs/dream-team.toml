# The dream team (packs/dream-team) alone, imported by the pack tool as a
# person imports it. What the pack leaves to the project is here: the
# logins of its deploy environment (packs/dream-team/environment/up), the
# variable its deploy tools find the sockets by, and time for a build.
[eval]
pack = "dream-team"

[execution]
environment = ["LANG", "LC_ALL", "TERM", "HOME", "PATH", "OMUNCULUS_DEPLOY"]
timeout_ms = 300000

[auth.homologation]
kind = "api_key"
key = "$OMUNCULUS_HOMOLOGATION_KEY"

[auth.production]
kind = "api_key"
key = "$OMUNCULUS_PRODUCTION_KEY"
