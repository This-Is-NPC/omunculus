# The sales desk (packs/sales-desk) answering the client, with the dream
# team (packs/dream-team) one depth below the seller, both imported by the
# pack tool. What the packs leave to the project is as in dream-team.toml.
[eval]
packs = [{ name = "sales-desk" }, { name = "dream-team", depth = 2 }]

[execution]
environment = ["LANG", "LC_ALL", "TERM", "HOME", "PATH", "OMUNCULUS_DEPLOY", "OMUNCULUS_DEPLOY_PROVIDER"]
timeout_ms = 300000

# The seller attaches the proposal it gives the client.
[store]
attachments = ".omunculus/attachments"
attachment_bytes = 10485760

[auth.homologation]
kind = "api_key"
key = "$OMUNCULUS_HOMOLOGATION_KEY"

[auth.production]
kind = "api_key"
key = "$OMUNCULUS_PRODUCTION_KEY"

[policy]
default_agent = "sales"
request_routes = [{ name = "owner", via = ["owners", "origin"] }, { via = ["parent", { kind = "agent", agent = "sales" }, "origin"] }]
