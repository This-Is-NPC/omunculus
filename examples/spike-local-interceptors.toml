# Real local provider (FastFlowLM) plus the interceptor lane, for
# `omunculus spike --provider chat --config examples/spike-local-interceptors.toml`.

[chat]
api = "openai-completions"
auth = "none"
base_url = "http://127.0.0.1:52625/v1"
model = "qwen3.5:4b"

[[interceptors]]
name = "audit"
events = ["task.requested", "task.delegated", "tool.call.requested", "task.completed"]
module = "Omunculus.Interceptors.Audit"

[[interceptors]]
name = "depth-gate"
events = ["task.delegated"]
module = "Omunculus.Interceptors.DepthGate"
options = { max_depth = 2 }
