[tools]
deno = "2.9.6"
elixir = "1.17.3-otp-27"
erlang = "27.3.4.17"
python = "3.14.8"
rebar = "3.27.0"
rust = "1.99.1"

[env]
MIX_REBAR3 = "rebar3"

[tasks."benchmark:build"]
description = "Build the linear benchmark, harness release and master Rust stub"
run = "scripts/benchmark-build"
sources = ["bench/lib/**/*.ex", "bench/runner/Cargo.*", "bench/runner/src/**/*.rs", "bench/stub/Cargo.*", "bench/stub/src/**/*.rs", "lib/**/*.ex", "priv/**/*", "mix.exs", "mix.lock", "mise.toml", "scripts/benchmark-build"]
outputs = ["_build/bench/native/stub/release/benchmark_stub", "_build/bench/native/runner/release/capacity_benchmark", "_build/bench/rel/benchmark/bin/benchmark", "_build/bench/native/build.json"]

[tasks."benchmark:check"]
description = "Test the Rust benchmark controller and compile the BEAM driver"
depends = ["benchmark:build"]
run = "scripts/benchmark-check"

[tasks."benchmark:preflight"]
description = "Linear resident benchmark: preflight"
run = "scripts/benchmark-preflight"

[tasks."benchmark:report"]
description = "Linear resident benchmark: report"
run = "scripts/benchmark-report"
usage = '''
arg "[folder]" help="Result folder to report; bench/results when left out"
'''

[tasks."benchmark:run"]
description = "Linear resident benchmark: run"
run = "scripts/benchmark-run"
usage = '''
flag "--profiles <profiles>" help="Hardware profiles to run, comma-separated: A, B or A,B"
flag "--interval-ms <ms>" help="Minimum interval between two agent creations"
flag "--context-bytes <bytes>" help="Context each agent holds"
flag "--max-agents <count>" help="Stop after this many agents"
flag "--pin-cpus" help="Pin each profile to its CPUs; requires the cpuset controller"
flag "--output <folder>" help="Result folder"
'''

[tasks.check]
description = "Check that the code is formatted, docs/cli.md is current, the documentation's links resolve, the console and kit read their spacing from the theme and every app's QML loads"
depends = ["check:cli", "check:format", "check:links", "check:qml", "check:spacing"]

[tasks."check:cli"]
description = "Check that docs/cli.md is what docs:cli writes"
run = "scripts/docs-cli --check"

[tasks."check:format"]
description = "Check that the Elixir code is formatted"
run = "scripts/check-format"

[tasks."check:links"]
description = "Check that every relative link, image and anchor of the documentation resolves"
run = "scripts/check-links"

[tasks."check:qml"]
description = "Check that every app's QML loads: each runs headless under quickshell and must report its configuration loaded without errors"
run = "scripts/check-qml"
sources = ["apps/**/*.qml", "apps/**/qmldir", "scripts/check-qml"]

[tasks."check:spacing"]
description = "Check that the console and the kit read margins, paddings, spacings and heights from Theme, not numbers"
run = "scripts/check-spacing"

[tasks."dev:bootstrap"]
description = "Create each dev project's workspace with its packs' workspace files and seed its local administrator once"
run = "scripts/dev-bootstrap"

[tasks."dev:console"]
description = "Open the console on the dev project of a running server"
run = "scripts/dev-console"

[tasks."dev:diagram"]
description = "Draw a dev project's conversation as a sequence diagram (dev/diagrams/<id>.svg and .mmd); the latest one unless an id is given"
run = "scripts/dev-diagram"
usage = '''
flag "--project <project>" help="the dev project" default="agency" {
  choices "agency" "dev"
}
arg "[conversation]" help="the conversation id; the latest one when left out"
'''

[tasks."dev:mailbox"]
description = "Open the mailbox on the dev project of a running server"
run = "scripts/dev-mailbox"

[tasks."dev:reset"]
description = "Delete the dev projects' stores and workspaces"
run = "scripts/dev-reset"
confirm = "Delete every dev project's store and workspace?"

[tasks."dev:serve"]
description = "Run the server on the dev registry, with the keys of .env, the deploy sockets and keys and your git identity"
depends = ["dev:bootstrap"]
run = "scripts/dev-serve"

[tasks."dev:studio"]
description = "Open the studio on the agency project of a running server; -- --project dev for the other"
run = "scripts/dev-studio"

[tasks."docs:cli"]
description = "Write docs/cli.md from the binary's moduledoc and the cli tools' manifests"
run = "scripts/docs-cli"

[tasks."eval:compare"]
description = "Equivalent Exchange: compare two result folders (mise run eval:compare -- <before> <now>)"
run = "scripts/eval-compare"
usage = '''
arg "<before>" help="The earlier result folder"
arg "<now>" help="The later result folder"
'''

[tasks."eval:recovery:check"]
description = "Check the experimental steward recovery tool contracts"
run = "scripts/check-course-recovery"

[tasks."eval:recovery"]
description = "Measure steward recovery against a frozen coordination checkpoint"
run = "scripts/eval-recovery"
usage = '''
flag "--source <folder>" help="Result folder containing the frozen coordination checkpoint" required=#true
flag "--overlay <file>" help="Experimental supervision TOML overlay" required=#true
flag "--k <count>" help="Repetitions per arm" default="3"
flag "--budget <responses>" help="Recorded model responses per diagnostic trial" default="20"
'''

[tasks."eval:run"]
description = "Equivalent Exchange: run the behaviour benchmark (mise run eval:run -- --model <model> --k 2)"
run = "scripts/eval-run"
usage = '''
flag "--model <model>" help="Model every agent runs on"
flag "--agent-model <agent=model>" var=#true help="Model one agent runs on instead"
flag "--k <count>" help="Repetitions per task and configuration"
flag "--label <name>" help="Name of the result folder"
flag "--task <part>" var=#true help="Run only the tasks whose id holds this part"
flag "--configuration <name>" var=#true help="Run only this configuration"
flag "--timeout <seconds>" help="Seconds an execution may take, or infinity"
flag "--jobs <count>" help="Executions run at once"
flag "--against <folder>" help="Result folder the report compares with"
flag "--code-mode" help="Turn on the model's code_mode"
flag "--overlay <file>" help="Experimental TOML configuration overlay"
flag "--resume <folder>" help="Continue the unfinished executions of a result folder; takes no other flag"
'''

[tasks."eval:selftest"]
description = "Equivalent Exchange: prove every task's check against its solution"
run = "scripts/eval-selftest"

[tasks.pre-commit]
description = "Check the boundaries, formatting and documentation before a commit"
run = ["scripts/validate-boundaries", "scripts/check-format", "scripts/docs-cli --check", "scripts/check-links"]

[tasks.pre-push]
description = "Run regular validation before a push"
run = "scripts/validate-regular"

[tasks.up]
description = "Start the dev server, unless one already answers; open the apps with dev:console, dev:studio and dev:mailbox"
depends = ["dev:bootstrap"]
run = "scripts/up"

[tasks."validate:boundaries"]
description = "Check that the apps and the core share only the server's contract"
run = "scripts/validate-boundaries"

[tasks."validate:regular"]
description = "Run the regular test suite"
run = "scripts/validate-regular"

[tasks."bench:shell"]
description = "Measure the per-call latency of the bash tool: 20 sequential true commands"
run = "scripts/bench-shell"

[tasks."validate:sandbox"]
description = "Run Bubblewrap integration tests on a supported Linux host"
run = "scripts/validate-sandbox"
