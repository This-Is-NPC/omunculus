name = "deploy_preview"
kind = "tool"
triggers = ["model"]
description = "Publishes the workspace's last commit to the preview environment, where the person sees it before anything reaches production, and concludes the stage that publishes: comments the preview address and the commit on the work and continues it, ending the run. The app, its port and the variables it reads come from deploy.toml; the image is built from the Dockerfile at the workspace's root."
tags = ["deploy", "sequence"]
command = ["./run"]
secrets = ["DEPLOY_KEY"]
chains = ["comment", "continue", "end"]
then = ["end"]

[parameters]
type = "object"
required = []
