name = "deploy_preview"
kind = "tool"
triggers = ["model"]
description = "Publishes the workspace's last commit to homologation, where the person sees it before anything reaches production, and gives its address. app names it: lowercase letters, digits and dashes. Dokku builds it from a Dockerfile, or detects the language."
tags = ["deploy"]
command = ["./run"]
secrets = ["DEPLOY_KEY"]

[parameters]
type = "object"
required = ["app"]

[parameters.properties.app]
type = "string"
