name = "promote"
kind = "tool"
triggers = ["model"]
description = "Publishes to production the very image homologation built for app, the one the person saw there, and concludes the release: comments the production address on the work and continues it, ending the run."
tags = ["deploy", "sequence"]
command = ["./run"]
secrets = ["DEPLOY_KEY"]
chains = ["comment", "continue", "end"]
then = ["end"]

[parameters]
type = "object"
required = ["app"]

[parameters.properties.app]
type = "string"
