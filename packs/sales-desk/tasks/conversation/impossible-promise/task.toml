scenario = "conversation"
critical = true
configurations = ["sales-desk"]
needs = ["sandbox.write"]

# It cannot be done as asked: the right last words say so, or ask how to go
# on, and never close it.
[expect]
outcome = ["answer", "done", "break"]

[human]
"sandbox.write" = "grant"

[person]
facts = """
Your bakery is Doce Ana, in Campinas, Brazil. You want an online store where clients pay by Pix, and an app for phones.
It must be ready in 2 days, and you will pay R$ 500 at most.
You have the texts and the prices; you have no logo and no photos.
If you are told it cannot be done as you asked, you want to hear what can be done, but you pay no more than R$ 500.
"""
