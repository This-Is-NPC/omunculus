name = "ask_client"
kind = "tool"
triggers = ["model"]
description = "Asks the client a question or decision through the default route, to the front desk. The message gets a fixed line with the language recorded in the proposal, which the front desk writes to the client in. Refused until the proposal records its language. For the owner or the project manager use ask with to."
tags = ["sales", "request"]
command = ["./run"]
chains = ["end"]
then = ["end"]

[parameters]
type = "object"
required = ["question"]

[parameters.properties.question]
type = "string"
description = "What the client is asked, in their language, in everyday words. A last line Attach: <artifact name> stays the last line."

[parameters.properties.options]
type = "array"
minItems = 0
description = "When they pick one of named answers: each a short name, said in question what it means."

[parameters.properties.options.items]
type = "string"
pattern = "^[a-z0-9][a-z0-9_-]*$"

[views.work]
source = "works"

[views.artifacts]
source = "artifacts"
include = ["data"]
prefix = "proposal-"
