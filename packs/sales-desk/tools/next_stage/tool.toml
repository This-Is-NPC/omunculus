name = "next_stage"
kind = "tool"
triggers = ["model"]
description = "Moves the client's request to the next stage of its workflow, sale (the seller's) or engagement (the project manager's): comments the report on the work and continues it, ending the run. Refused until the stage holds — the engagement's proposal artifact (written with the proposal tool) and the works below have what the stage asks — saying what is missing."
tags = ["sales", "sequence"]
command = ["./run"]
chains = ["comment", "continue", "end"]
then = ["end"]

[parameters]
type = "object"
required = ["report"]

[parameters.properties.report]
"$ref" = "report"

[views.report_required]
source = "report_required"

[views.work]
source = "works"

[views.cause]
source = "events"
relation = "cause"

[views.children]
source = "works"
relation = "children"

[views.artifacts]
source = "artifacts"
include = ["data"]
prefix = "proposal-"
