name = "proposal"
kind = "tool"
triggers = ["model"]
description = "Writes the proposal of this client's request: fields are laid over the latest version, the price is worked out from the scope's pages by the desk's table and discount, and the artifacts proposal (the data) and proposal.md (the client's document) get their next versions. Give the client proposal.md with attach, by artifact name: it hands exactly that version."
tags = ["sales", "artifacts"]
command = ["./run"]

[parameters]
type = "object"
required = ["fields"]

[parameters.properties.fields]
type = "object"
description = "What to set, merged key by key into the proposal: client, business, city, audience, decider, budget_timing, problem, content {texts, products, contacts}, scope {pages, features, excluded} (lists), design {preview}, timing, next_steps, assessment {work, answer, conditions}, pending (list), status (draft, sent, accepted, refused or approved). The client's own words, in their language."

[parameters.properties.discount]
type = "number"
description = "Percent off, up to what the desk may give on its own; kept for the next versions."

[views.work]
source = "works"

[views.artifacts]
source = "artifacts"
include = ["data"]
