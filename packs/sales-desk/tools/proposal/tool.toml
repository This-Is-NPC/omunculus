name = "proposal"
kind = "tool"
triggers = ["model"]
description = "Writes the proposal of this client's engagement, the same whether the seller or the project manager writes it: fields are laid over the latest version, the price is worked out from the scope's pages by the desk's table and discount, and the artifacts proposal-<work id> (the data) and proposal-<work id>.md (the client's document) get their next versions. Give the client the document with attach, by its artifact name: it hands exactly that version. The status sent, accepted or approved is refused without language and while pending lists what the content already holds. A write built on a version another call replaced is refused; read it again."
tags = ["sales", "artifacts"]
command = ["./run"]

[parameters]
type = "object"
required = ["fields"]

[parameters.properties.fields]
type = "object"
description = "What to set, merged key by key into the proposal: language (of the client's own messages, required before status sent), client, business, city, audience, decider, budget_timing, problem, content {texts, products, contacts}, scope {pages, features, excluded} (lists), design {state (approved or waived), address, client_answer (the client's own answer, required to waive)}, delivery {address (homologation), accepted (the word accepted, once the client accepted the built site), production (address)}, timing, next_steps, assessment {answer, conditions}, pending (list), status (draft, sent, accepted, refused or approved). The client's own words, in their language."

[parameters.properties.discount]
type = "number"
description = "Percent off, up to what the desk may give on its own; kept for the next versions."

[views.work]
source = "works"

[views.artifacts]
source = "artifacts"
include = ["data"]
prefix = "proposal-"
