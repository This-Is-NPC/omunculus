name = "render_proposal"
kind = "tool"
triggers = ["model"]
description = "Renders the latest version of this request's proposal again, as the next version of the artifact proposal.md, from templates/proposal.md. The proposal tool already renders each version it writes; use this after the template changed."
tags = ["sales", "artifacts"]
command = ["./run"]

[parameters]
type = "object"
required = []

[views.work]
source = "works"

[views.artifacts]
source = "artifacts"
include = ["data"]
