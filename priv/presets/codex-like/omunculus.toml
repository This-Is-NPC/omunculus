[execution]
backend = "bubblewrap"
runtimes = ["/usr"]
environment = ["LANG", "LC_ALL", "TERM"]
timeout_ms = 30000
max_output_bytes = 1048576
max_concurrent = 4
max_queue = 64
queue_timeout_ms = 30000

[store]
path = ".omunculus/store.sqlite3"

[tools]
paths = ["../../tools", "./tools"]

[models.fake]
api = "module"
module = "Omunculus.Model.Fake"

[agents.codex]
depth = 0
model = "fake"
tools = ["bash", "catalog", "fs.read", "fs.write", "request_access", "sandbox.write", "store"]
human = ["delete"]
text = """
You are a Codex-style coding agent. Work in the repository with Bash and filesystem tools, report progress on the work item, and finish when the task is complete.
"""
