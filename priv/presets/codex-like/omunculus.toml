[execution]
backend = "bubblewrap"
runtimes = ["/usr"]
environment = ["LANG", "LC_ALL", "TERM"]
timeout_ms = 30000
max_output_bytes = 1048576
max_concurrent = 4
max_queue = 64
queue_timeout_ms = 30000
resources = ["sandbox.write", "sandbox.network"]

[execution.sandbox]
script = "../../sandbox.js"
command = ["deno", "run", "--no-config", "--no-lock", "--no-prompt", "--cached-only", "--deny-read", "--deny-write", "--deny-net", "--deny-env", "--deny-run", "--deny-ffi", "--deny-sys", "--deny-import"]
runner = 'input=$1; errors=$2; status=$3; shift 3; "$@" < "$input" 2> "$errors"; result=$?; printf %s "$result" > "$status"; exit "$result"'
exec = 'exec "$@"'

[store]
path = ".omunculus/store.sqlite3"

[tools]
paths = ["../../tools", "./tools"]

[auth]
store = ".omunculus/auth.json"

[auth.openai-codex]
kind = "oauth-code"
authorize_url = "https://auth.openai.com/oauth/authorize"
token_url = "https://auth.openai.com/oauth/token"
client_id = "app_EMoamEEZ73f0CkXaXp7hrann"
scopes = ["openid", "profile", "email", "offline_access"]
pkce = true
authorize_params = { originator = "omunculus", codex_cli_simplified_flow = "true" }
callback = { host = "localhost", port = 1455, path = "/auth/callback" }
credential = { access = "access_token", refresh = "refresh_token", expires = "expires_in" }
refresh = { token_url = "https://auth.openai.com/oauth/token" }

[auth.cursor]
kind = "tool"
login = "cursor_login"
refresh = "cursor_refresh"

[models.fake]
api = "module"
module = "Omunculus.Model.Fake"

[models.codex]
provider = "openai-codex"
api = "openai-responses"
url = "https://chatgpt.com/backend-api/codex"
model = "gpt-5-codex"
timeout_ms = 120000

[models.cursor]
provider = "cursor"
api = "command"
command = ["./bridges/cursor-agent"]
model = "composer-2.5"

[agents.codex]
depth = 0
model = "fake"
tools = ["bash", "catalog", "fs.read", "fs.write", "request_access", "request_sandbox", "sandbox.write", "store"]
human = ["delete"]
text = """
You are a Codex-style coding agent. Work in the repository with Bash and filesystem tools, report progress on the work item, and finish when the task is complete.
"""
