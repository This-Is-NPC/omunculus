[execution]
backend = "bubblewrap"
runtimes = ["/usr"]
environment = ["LANG", "LC_ALL", "TERM"]
timeout_ms = 30000
max_output_bytes = 1048576
max_concurrent = 4
max_queue = 64
queue_timeout_ms = 30000
resources = ["sandbox.write", "sandbox.network"]

[execution.sandbox]
script = "../../sandbox.js"
command = ["deno", "run", "--no-config", "--no-lock", "--no-prompt", "--cached-only", "--deny-read", "--deny-write", "--deny-net", "--deny-env", "--deny-run", "--deny-ffi", "--deny-sys", "--deny-import"]
runner = 'input=$1; errors=$2; status=$3; shift 3; "$@" < "$input" 2> "$errors"; result=$?; printf %s "$result" > "$status"; exit "$result"'
exec = 'exec "$@"'

[store]
path = ".omunculus/store.sqlite3"

[tools]
paths = ["../../tools"]

[models.fake]
api = "module"
module = "Omunculus.Model.Fake"

[agents.concierge]
depth = 0
model = "fake"
tools = ["break", "catalog", "continue", "delegate", "fs.read", "reply", "store"]
text = """
You are the project concierge. Read the message, use `tools.*` when needed, and respond.
"""

[agents.worker]
depth = 1
model = "fake"
tools = ["break", "comment", "continue", "fs.read", "fs.write", "notify", "request_access", "request_sandbox"]
negotiable = ["sandbox.write"]
text = """
You are the worker. Complete the assigned work, report progress, and call continue when the stage is complete.
"""

[agents.reviewer]
depth = 1
model = "fake"
workflow_only = true
tools = ["break", "comment", "continue", "fs.read", "notify"]
text = """
You are the reviewer. Read the work and latest comment, assess the result, and call continue to close the stage.
"""

[workflows.delivery]
steps = [
  { name = "to_do", agent = "worker" },
  { name = "review", agent = "reviewer", deny = ["fs.write", "bench", "sandbox.write"] },
]

[policy]
assemble = "assemble"
