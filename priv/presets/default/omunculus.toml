[execution]
backend = "bubblewrap"
runtimes = ["/usr"]
environment = ["LANG", "LC_ALL", "TERM"]
timeout_ms = 30000
max_output_bytes = 1048576
max_concurrent = 4
max_queue = 64
queue_timeout_ms = 30000
resources = ["sandbox.write", "sandbox.network"]

[execution.sandbox]
script = "../../sandbox.js"
command = ["deno", "run", "--no-config", "--no-lock", "--no-prompt", "--cached-only", "--deny-read", "--deny-write", "--deny-net", "--deny-env", "--deny-run", "--deny-ffi", "--deny-sys", "--deny-import"]
runner = 'input=$1; errors=$2; status=$3; shift 3; "$@" < "$input" 2> "$errors"; result=$?; printf %s "$result" > "$status"; exit "$result"'
exec = 'exec "$@"'

[store]
path = ".omunculus/store.sqlite3"

[tools]
paths = ["../../tools"]

[skills]
paths = ["~/.agents/skills", ".agents/skills"]

[models.fake]
api = "module"
module = "Omunculus.Model.Fake"

[agents.concierge]
depth = 0
model = "fake"
tools = ["break", "catalog", "continue", "delegate", "done", "end", "fs.read", "reopen", "reply", "skills", "store", "work"]
text = """
You are the project concierge; you talk with the person and hand work to the agents under ## Agents.
Goal: what the person asked, as they asked it. Its words are the bar for done; add no requirement of your own.
- What needs no tool you lack — a greeting, a question, an explanation — answer yourself in plain text.
- Otherwise call work with a report and the works, each naming the agent under ## Agents that takes it, or none when ## Agents shows a workflow. Hand the work down rather than asking for tools to do it yourself.
- When only part of the request can be done, get that part done and say what was left and why; do not drop the whole request for the missing part.
- When an agent under ## Agents breaks its work, read why: if it can go on, reopen its work with instructions; if it cannot, decide what the request still needs, and break to pass it up when no one below can do it.
- When ## Results comes back, check the result against the request, reading the files yourself when you can. If it is met, call done with a report that answers the person. If an agent can still meet it, call work saying what is missing. If no one can, call break and tell the person why. Do not ask for a check the request does not need.
- When an agent asks you for access, grant what the request needs and is safe; deny what could destroy, leak or reach outside the work, and say why. Never grant the network: only the person may let the work or a secret leave the machine.
"""

[agents.worker]
depth = 1
model = "fake"
tools = ["break", "comment", "continue", "done", "end", "fs.read", "fs.write", "notify", "request_access", "request_sandbox", "skills"]
human = ["sandbox.write"]
text = """
You are the worker. Complete the assigned work, report progress, and call done with a report when the stage is complete.
"""

[agents.reviewer]
depth = 1
model = "fake"
workflow_only = true
tools = ["break", "comment", "continue", "done", "end", "fs.read", "notify"]
text = """
You are the reviewer. Read the work and latest comment, assess the result, and call done with your assessment to close the stage.
"""

[workflows.delivery]
steps = [
  { name = "to_do", agent = "worker" },
  { name = "review", agent = "reviewer", deny = ["fs.write", "bench", "sandbox.write"] },
]

[policy]
assemble = "assemble"
max_retries = 3
last_run_output_bytes = 8192
tool_output_bytes = 32768
