[execution]
backend = "bubblewrap"
runtimes = ["/usr"]
environment = ["LANG", "LC_ALL", "TERM", "HOME", "PATH"]
timeout_ms = 30000
max_output_bytes = 1048576
max_concurrent = 4
max_queue = 64
queue_timeout_ms = 30000
resources = ["sandbox.write", "sandbox.network"]
# A command sees the machine as the person does, read-only: their tools,
# versions and settings, so what it builds runs for them. What follows it
# may not read: keys, logins, credentials and browser profiles.
host = true
deny_read = [
  "~/.ssh", "~/.gnupg", "~/.aws", "~/.azure", "~/.config/gcloud", "~/.kube",
  "~/.docker", "~/.netrc", "~/.git-credentials", "~/.config/gh", "~/.npmrc",
  "~/.pypirc", "~/.password-store", "~/.local/share/keyrings", "~/.mozilla",
  "~/.config/google-chrome", "~/.config/chromium", "~/.config/BraveSoftware",
  "~/.codex", "~/.claude",
]

[execution.sandbox]
script = "../../sandbox.js"
command = ["deno", "run", "--no-config", "--no-lock", "--no-prompt", "--cached-only", "--deny-read", "--deny-write", "--deny-net", "--deny-env", "--deny-run", "--deny-ffi", "--deny-sys", "--deny-import"]
runner = 'input=$1; errors=$2; status=$3; shift 3; "$@" < "$input" 2> "$errors"; result=$?; printf %s "$result" > "$status"; exit "$result"'
exec = 'exec "$@"'

[store]
path = ".omunculus/store.sqlite3"

[tools]
paths = ["../../tools"]

[skills]
paths = ["~/.agents/skills", ".agents/skills"]

[auth]
store = ".omunculus/auth.json"

[auth.anthropic]
kind = "oauth-code"
authorize_url = "https://claude.ai/oauth/authorize"
token_url = "https://console.anthropic.com/v1/oauth/token"
client_id = "9d1c250a-e61b-44d9-88ed-5944d1962f5e"
scopes = ["org:create_api_key", "user:profile", "user:inference"]
pkce = true
callback = { host = "localhost", port = 54545, path = "/callback" }
credential = { access = "access_token", refresh = "refresh_token", expires = "expires_in" }
refresh = { token_url = "https://console.anthropic.com/v1/oauth/token" }

[models.fake]
api = "module"
module = "Omunculus.Model.Fake"

[models.claude]
provider = "anthropic"
api = "anthropic-messages"
url = "https://api.anthropic.com/v1"
model = "claude-sonnet-4-5"
timeout_ms = 120000
headers = { anthropic-beta = "oauth-2025-04-08" }
body = { max_tokens = 32000 }

[agents.pi]
depth = 0
model = "fake"
tools = ["catalog", "fs.read", "fs.write", "request_access", "sequence", "skills", "store"]
human = ["sandbox.write"]
text = """
You are a Pi-style agent: compact, direct, and without shell access. Read and edit files with tools, record the work performed, request access when needed, and call done with a report when the work is complete.
"""

[policy]
assemble = "assemble"
max_retries = 3
last_run_output_bytes = 8192
tool_output_bytes = 32768
conversation_bytes = 16384
