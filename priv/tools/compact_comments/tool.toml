name = "compact_comments"
kind = "tool"
triggers = ["model"]
description = "Summarizes comments on the work and rewrites the row: load reads, commit writes the summary."
tags = ["comments", "compact", "work"]
module = "Omunculus.Tools.CompactComments"

[parameters]
type = "object"
required = ["op"]

[parameters.properties.op]
type = "string"
enum = ["load", "commit"]

[parameters.properties.summary]
type = "string"

[parameters.properties.ids]
type = "array"

[parameters.properties.ids.items]
type = "string"

[views.comments]
source = "comments"
