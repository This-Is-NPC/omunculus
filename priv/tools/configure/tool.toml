name = "configure"
kind = "tool"
triggers = ["cli", "chain"]
description = "Writes one item of the config (agents.<name>, models.<name>, workflows.<name>, workspaces.<name>, auth.<name>, secrets.<tool>, policy or access) from a JSON table, or removes it for null, while the file is at the revision config printed."
tags = ["cli", "config"]
groups = ["cli"]
module = "Omunculus.Tools.Configure"

[parameters]
type = "object"
required = ["item", "value", "revision"]

[parameters.properties.item]
type = "string"

[parameters.properties.value]
type = "string"

[parameters.properties.revision]
type = "string"

[parameters.properties.from]
type = "string"
