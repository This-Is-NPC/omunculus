name = "delegate"
kind = "tool"
triggers = ["chain"]
description = "Creates a child work and hands it to the named agent or to whoever is below. The parent waits for all its children."
tags = ["sequence", "work"]
groups = ["sequence"]
module = "Omunculus.Tools.Delegate"

[parameters]
type = "object"
required = ["title", "goal"]

[parameters.properties.title]
type = "string"

[parameters.properties.goal]
type = "string"

[parameters.properties.agent]
type = "string"

[parameters.properties.workspace]
type = "string"
description = "The name of another workspace the project configures; leave it out to work where you are."
