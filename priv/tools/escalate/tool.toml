name = "escalate"
kind = "tool"
triggers = ["model", "cli"]
description = "Raises received requests you cannot answer as one question. origins maps each distinct part name to its received request ID; the receiver sees each origin's question and who asked it. reason is what the receiver is asked, written to them in their language as it should reach them: the merged question alone, without request or work IDs, stage or part names, or notes for agents. Optional to names a route in the project's request_routes; omit to to follow the default route. Routing chooses the next receiver. The run ends; the answer returns with the linked origins for distribution."
tags = ["request"]
groups = ["sequence"]
module = "Omunculus.Tools.Escalate"
chains = ["end"]
then = ["end"]

[parameters]
type = "object"
required = ["reason", "origins"]
[parameters.properties.reason]
type = "string"
[parameters.properties.origins]
type = "object"
minProperties = 1
[parameters.properties.origins.additionalProperties]
type = "string"

[parameters.properties.to]
description = "Optional name of a route in the project's request_routes. Omit to to follow the default route."
type = "string"
minLength = 1
