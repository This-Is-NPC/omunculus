name = "grep"
kind = "tool"
views = ["paths"]
triggers = ["model"]
description = "Searches file contents for text, keeping at most limit matches."
tags = ["fs"]
groups = ["fs.read"]
module = "Omunculus.Tools.Grep"

[parameters]
type = "object"
required = ["pattern"]

[parameters.properties.pattern]
type = "string"

[parameters.properties.path]
type = "string"

[parameters.properties.limit]
type = "integer"
minimum = 1
