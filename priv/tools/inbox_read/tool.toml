name = "inbox_read"
kind = "tool"
triggers = ["cli"]
description = "Marks a notification as read: the next inbox listing leaves it out."
tags = ["cli", "inbox"]
groups = ["cli"]
module = "Omunculus.Tools.InboxRead"

[parameters]
type = "object"
required = ["inbox_id"]

[parameters.properties.inbox_id]
type = "string"
description = "The notification, by the id inbox lists."
