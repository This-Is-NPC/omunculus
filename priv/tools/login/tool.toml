name = "login"
kind = "tool"
triggers = ["cli"]
description = """
Stores a credential for an [auth.<id>] provider in the JSON file [auth] store names (mode 0600). An api_key provider takes key, or reads it from stdin after the prompt api key: ; an oauth-code provider opens a localhost callback, with PKCE when the provider asks for it; a tool provider dispatches its login tool instead. A provider the TOML does not declare is unknown auth provider: <id>.
"""
tags = ["cli", "auth"]
groups = ["cli"]
module = "Omunculus.Tools.Login"

[parameters]
type = "object"
required = ["provider"]

[parameters.properties.provider]
type = "string"
description = "The [auth.<id>] provider."

[parameters.properties.key]
type = "string"
description = "The API key of an api_key provider; without it, read from stdin."

[parameters.properties.redirect_url]
type = "string"
description = "The callback address of an oauth-code login."
