name = "logout"
kind = "tool"
triggers = ["cli"]
description = "Removes a provider's stored credential from the auth store; the TOML is not touched."
tags = ["cli", "auth"]
groups = ["cli"]
module = "Omunculus.Tools.Logout"

[parameters]
type = "object"
required = ["provider"]

[parameters.properties.provider]
type = "string"
description = "The [auth.<id>] provider."
