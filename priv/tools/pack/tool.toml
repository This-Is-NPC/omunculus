name = "pack"
kind = "tool"
triggers = ["cli", "chain"]
description = "Imports the pack in path into the project, depth depths below its own when given: writes it to [[packs]] with the models its roles run on and the logins its providers stand for, and copies its workspace/ files where none are; without them, says what it needs."
tags = ["cli", "pack"]
groups = ["cli"]
module = "Omunculus.Tools.Pack"

[parameters]
type = "object"
required = ["path"]

[parameters.properties.path]
type = "string"
description = "The pack's folder, relative to the config's directory."

[parameters.properties.models]
type = "string"
description = "role=model pairs, comma separated: the config's model each role runs on."

[parameters.properties.auth]
type = "string"
description = "provider=login pairs, comma separated: the config's [auth] provider each of the pack's stands for."

[parameters.properties.depth]
type = "string"
description = "How many depths below its own the team works: every agent and depth layer of the pack moves down that many."
