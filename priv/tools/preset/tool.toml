name = "preset"
kind = "tool"
triggers = ["cli"]
config = false
description = """
Applies a preset: copies the omunculus.toml of the bundled preset called name, or of from when it is given, onto the config path, and its tools/ beside it when there is one. [tools] paths, the path of each [[packs]] and [execution.sandbox] script are rewritten to absolute locations resolved against from, and the tools/ folder beside the written file is added to paths. A from that is not a folder holding omunculus.toml is unknown preset: <name>. It is the one command that runs without a config.
"""
tags = ["cli", "preset"]
groups = ["cli"]
module = "Omunculus.Tools.Preset"

[parameters]
type = "object"
required = ["name"]

[parameters.properties.name]
type = "string"
description = "The preset's name: a bundled one (default, codex-like, pi-like) unless from names another folder; recorded in the receipt preset <name> applied."

[parameters.properties.from]
type = "string"
description = "A folder that holds omunculus.toml, for a preset that is not bundled."
