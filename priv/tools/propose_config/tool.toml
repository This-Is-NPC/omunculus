name = "propose_config"
kind = "tool"
triggers = ["model"]
description = "Proposes to the person one change to the project's config: item (agents.<name>, models.<name>, workflows.<name>, workspaces.<name>, auth.<name>, secrets.<tool>, policy or access) takes the keys value gives, laid over the table the file holds: a key you leave out stays, a key you give as null is removed, a list you give replaces the file's whole, and null as value removes the item. The config it would make is loaded first: a change that does not load, that changes nothing, that cites a run that does not exist or that the person already refused is refused here, with why. One that loads becomes a request to the person, with the item as the config runs it now and as it would run, and the run ends until the person applies or denies it."
tags = ["config"]
groups = ["configuring"]
module = "Omunculus.Tools.ProposeConfig"
chains = ["end"]
then = ["end"]

[parameters]
type = "object"
required = ["item", "reason"]

[parameters.properties.item]
type = "string"

[parameters.properties.value]
description = "The keys to change, as a table: a key you leave out stays as the file has it, a key set to null is removed, a list replaces the file's whole, and a nested table is changed key by key. null removes the item."

[parameters.properties.runs]
type = "array"
description = "The ids of the runs that show why, as runs prints them; each must be one of the project's recent closed runs. Leave out when no run is the reason."

[parameters.properties.runs.items]
type = "string"

[views.recent]
source = "runs"
relation = "recent"
limit = 40

[views.answered]
source = "requests"
relation = "answered"

[parameters.properties.from]
type = "string"
description = "An item of the same section renamed to item."

[parameters.properties.reason]
type = "string"
description = "Why, for the person deciding."
