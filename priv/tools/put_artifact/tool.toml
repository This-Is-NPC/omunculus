name = "put_artifact"
kind = "tool"
triggers = ["model"]
description = "Writes the next version of an artifact of this conversation: name and kind (a lowercase word) say which, data is a JSON object, content is text of a media_type, or base64 is the bytes of one (an image, a PDF). A version never changes; a change is the next version. base, the number of the version you built on (0 for none), refuses the write when another came since."
tags = ["files", "artifacts"]
groups = ["artifacts"]
module = "Omunculus.Tools.PutArtifact"

[parameters]
type = "object"
required = ["name", "kind"]

[parameters.properties.name]
type = "string"

[parameters.properties.kind]
type = "string"

[parameters.properties.data]
type = "object"

[parameters.properties.content]
type = "string"

[parameters.properties.base64]
type = "string"

[parameters.properties.media_type]
type = "string"

[parameters.properties.base]
type = "integer"

[parameters.properties.note]
type = "string"

[views.artifacts]
source = "artifacts"
