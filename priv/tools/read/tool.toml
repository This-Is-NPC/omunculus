name = "read"
kind = "tool"
views = ["paths"]
triggers = ["model"]
description = "Reads a file, or limit lines of it from line offset (from 1)."
tags = ["fs"]
groups = ["fs.read"]
module = "Omunculus.Tools.Read"

[parameters]
type = "object"
required = ["path"]

[parameters.properties.path]
type = "string"

[parameters.properties.offset]
type = "integer"
minimum = 1

[parameters.properties.limit]
type = "integer"
minimum = 1
