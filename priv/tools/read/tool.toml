name = "read"
kind = "tool"
triggers = ["model"]
description = "Reads a file, or limit lines of it from line offset (from 1). An image or a PDF is shown to you instead of read as text."
tags = ["fs"]
groups = ["fs.read"]
module = "Omunculus.Tools.Read"

[parameters]
type = "object"
required = ["path"]

[parameters.properties.path]
type = "string"

[parameters.properties.offset]
type = "integer"
minimum = 1

[parameters.properties.limit]
type = "integer"
minimum = 1

[views.paths]
source = "paths"
