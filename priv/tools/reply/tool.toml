name = "reply"
kind = "tool"
triggers = ["cli", "model"]
description = "Answers a request with text, optionally picking one of its options to run its tool calls."
tags = ["store", "request"]
groups = ["store"]
module = "Omunculus.Tools.Reply"
chains = ["grant", "cancel", "configure", "pack"]

[parameters]
type = "object"
required = ["body", "request_id"]

[parameters.properties.body]
type = "string"

[parameters.properties.request_id]
type = "string"

[parameters.properties.option]
type = "string"

[views.request]
source = "requests"
