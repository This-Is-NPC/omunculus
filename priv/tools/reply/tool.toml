name = "reply"
kind = "tool"
triggers = ["cli", "model"]
description = "Answers a request with text, optionally picking one of its options to run its tool calls."
tags = ["store", "request"]
groups = ["store"]
module = "Omunculus.Tools.Reply"
chains = ["grant", "cancel", "configure", "pack", "jobs"]

[parameters]
type = "object"
required = ["body", "request_id"]

[parameters.properties.body]
type = "string"

[parameters.properties.request_id]
type = "string"

[parameters.properties.option]
type = "string"

[parameters.properties.attachments]
type = "array"
description = "The files the answer carries, each as the server kept it: name, media_type, bytes and sha256."

[parameters.properties.attachments.items]
type = "object"
required = ["name", "media_type", "bytes", "sha256"]

[views.request]
source = "requests"

[parameters.properties.parts]
type = "object"
[parameters.properties.parts.additionalProperties]
"$ref" = "#/$defs/answer"
[parameters."$defs".answer]
type = "object"
required = ["body"]
[parameters."$defs".answer.properties.body]
type = "string"
[parameters."$defs".answer.properties.option]
type = "string"
[parameters."$defs".answer.properties.parts]
type = "object"
[parameters."$defs".answer.properties.parts.additionalProperties]
"$ref" = "#/$defs/answer"
