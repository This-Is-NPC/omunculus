name = "reply"
kind = "tool"
shape = "simple"
triggers = ["cli", "model"]
description = "Answers a request: picks one of its options, whose tool calls run, with a comment."
tags = ["store", "request"]
groups = ["store"]
views = ["request"]
module = "Omunculus.Tools.Reply"
chains = ["grant", "cancel"]

[parameters]
type = "object"
required = ["body", "request_id", "option"]

[parameters.properties.body]
type = "string"

[parameters.properties.request_id]
type = "string"

[parameters.properties.option]
type = "string"
