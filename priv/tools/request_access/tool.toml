name = "request_access"
kind = "tool"
shape = "simple"
triggers = ["model"]
description = "Requests access to a tool, path, directory, or sandbox resource."
tags = ["store", "request"]
groups = ["store"]
module = "Omunculus.Tools.RequestAccess"

[parameters]
type = "object"
required = ["kind", "name", "reason"]

[parameters.properties.kind]
type = "string"
enum = ["tool", "path", "directory", "resource"]

[parameters.properties.name]
type = "string"

[parameters.properties.reason]
type = "string"
