name = "request_access"
kind = "tool"
triggers = ["model"]
description = "Requests access to a tool, path, or directory: comments the report on the run's work when it has one, opens the request and ends the run."
tags = ["store", "request"]
groups = ["store"]
module = "Omunculus.Tools.RequestAccess"
chains = ["end"]
then = ["end"]

[parameters]
type = "object"
required = ["report", "kind", "name", "reason"]

[parameters.properties.report]
type = "string"

[parameters.properties.kind]
type = "string"
enum = ["tool", "path", "directory"]

[parameters.properties.name]
type = "string"

[parameters.properties.reason]
type = "string"

[views.grant_scopes]
source = "grant_scopes"
