name = "send"
kind = "tool"
triggers = ["cli"]
description = "Delivers the message and opens the first run: of the work work_id names, else of the agent of depth 0 agent names, else of the agent the conversation began with, else of the only agent of depth 0."
groups = ["cli"]
module = "Omunculus.Tools.Send"

[parameters]
type = "object"
required = ["message"]

[parameters.properties.message]
type = "string"

[parameters.properties.agent]
type = "string"
description = "The agent of depth 0 the message is for, when there is more than one."

[parameters.properties.attachments]
type = "array"
description = "The files the message carries, each as the server kept it: name, media_type, bytes and sha256."

[parameters.properties.attachments.items]
type = "object"
required = ["name", "media_type", "bytes", "sha256"]
