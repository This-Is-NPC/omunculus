name = "send"
kind = "tool"
triggers = ["cli"]
description = """
Delivers the message and opens the first run: of the work work_id names, else of the agent of depth 0 agent names, else of the agent the conversation began with, else of the only agent of depth 0. It writes PROMPTS(message) and EVENTS(prompt); it creates no work and copies the message onto no title. A work waiting on a request, or parked by break, is reopened first, with EVENTS(work) reason reopened_by_prompt; a work waiting on its children stays waiting, and the message opens a run of its agent. A successful send prints nothing: the assembled prompt and the model's text are in the store.
"""
groups = ["cli"]
module = "Omunculus.Tools.Send"

[parameters]
type = "object"
required = ["message"]

[parameters.properties.message]
type = "string"

[parameters.properties.work_id]
type = "string"
description = "The work the message is for."

[parameters.properties.agent]
type = "string"
description = "The agent of depth 0 the message is for, when there is more than one."

[parameters.properties.attachments]
type = "array"
description = "The files the message carries, each as the server kept it: name, media_type, bytes and sha256."

[parameters.properties.attachments.items]
type = "object"
required = ["name", "media_type", "bytes", "sha256"]
