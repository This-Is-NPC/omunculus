name = "work"
kind = "tool"
triggers = ["model"]
description = "Creates works with a title and a goal: comments the report on the run's work, delegates each work below it and ends the run. Without a work, creates the root work with the report as its first comment and, when each work names an agent or a workflow of the depth below, or none does and that depth has one agent or requires one workflow, hands them down at once."
tags = ["sequence", "work"]
groups = ["sequence"]
module = "Omunculus.Tools.Work"
chains = ["comment", "delegate", "end"]
then = ["end"]

[parameters]
type = "object"
required = ["report", "works"]

[parameters.properties.report]
type = "string"

[parameters.properties.works]
type = "array"
minItems = 1

[parameters.properties.works.items]
type = "object"
required = ["title", "goal"]

[parameters.properties.works.items.properties.title]
type = "string"

[parameters.properties.works.items.properties.goal]
type = "string"

[parameters.properties.works.items.properties.agent]
type = "string"

[parameters.properties.works.items.properties.workflow]
type = "string"
description = "A workflow under ## Agents; name an agent or a workflow, not both."

[parameters.properties.works.items.properties.workspace]
type = "string"
description = "The name of another workspace the project configures; leave it out to work where you are."

[schemas.staged]
type = "object"
required = ["report", "works"]

[schemas.staged.properties.report]
type = "string"

[schemas.staged.properties.works]
type = "array"
minItems = 1

[schemas.staged.properties.works.items]
type = "object"
required = ["title", "goal"]

[schemas.staged.properties.works.items.properties.title]
type = "string"

[schemas.staged.properties.works.items.properties.goal]
type = "string"

[schemas.staged.properties.works.items.properties.workspace]
type = "string"
description = "The name of another workspace the project configures; leave it out to work where you are."
