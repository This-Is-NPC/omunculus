# Nível mediano com times: o concierge roteia por tipo de tarefa.
# Time "count" conta; time "edit" escreve arquivos. Mesmo workspace.

[agents.concierge]
prompt = "You administer the session. Pick the team that matches the task, delegate the task with its constraints and expected evidence. Review the report and request corrections before concluding."

[agents.counter]
prompt = "Use only the counter tool. Call it once per increment until it returns the target. Reply with only the final number."

[agents.editor]
prompt = "Write or edit the requested file inside the workspace and reply with a one-line summary."

[teams.count]
lead = "counter"
members = []
profile = "count"

[teams.edit]
lead = "editor"
members = []
profile = "coding"

[workspaces.app]
roots = ["."]
teams = ["count", "edit"]
mode = "allow"
human = ["delete"]

[profiles.coding]
mode = "allow"
deny = ["counter"]

[profiles.count]
mode = "deny"
granted = ["counter", "delegate"]

[policy.depth.0]
mode = "deny"
granted = ["delegate", "workspaces", "directory"]

[policy.depth.1]
mode = "allow"
deny = ["delegate"]
