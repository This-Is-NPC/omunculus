# Nível mediano: concierge em depth 0 delega a workers em depth 1, um workspace.
# Time "default" implícito: líder concierge, membros worker.

[agents.concierge]
prompt = "You administer the session. You never do the work yourself: delegate the task with its constraints and expected evidence. Review the report and request corrections before concluding."

[agents.worker]
prompt = "Execute the task using the available tools. Report the result, supporting evidence and any unfinished work."

[workspaces.app]
roots = ["."]
mode = "allow"
human = ["delete"]

[profiles.coding]
mode = "allow"

[profiles.count]
instructions = "Use only the counter tool. Call it once per increment until it returns the target. Report the final value and evidence in the completed/comment JSON contract."
mode = "deny"
granted = ["counter", "delegate"]

[policy.depth.0]
mode = "deny"
granted = ["delegate", "workspaces", "directory"]

[policy.depth.1]
mode = "allow"
deny = ["delegate"]
