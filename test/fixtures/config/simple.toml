# Nível simples: equivale a um harness padrão de mercado.
# Um agente em depth 0 com tools de arquivo, sem delegação.
# Sem [policy.depth]: allow. Sem [teams]: time "default".

[workspaces.app]
roots = ["."]
mode = "allow"
deny = ["delegate", "request_work"]

[profiles.coding]
mode = "allow"
deny = ["delegate", "request_work"]

[profiles.count]
instructions = "Use only the counter tool. Call it once per increment until it returns the target. Report the final value and evidence in the completed/comment JSON contract."
mode = "deny"
granted = ["counter"]
